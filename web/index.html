<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>NARA</title>
<style>
@font-face{font-family:"Anton";src:url(/assets/fonts/Anton-400.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Poppins";src:url(/assets/fonts/Poppins-400.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Poppins";src:url(/assets/fonts/Poppins-700.ttf) format("truetype");font-weight:700;font-display:swap}
:root{
  --bg:#0B0D10;--bg2:#101318;--panel:#14171C;--panel2:#1B1F26;--panel3:#232832;--line:#2A303A;
  --text:#EEF0F3;--muted:#8B94A1;--dim:#5E6672;
  --lime:#C8FF2E;--lime2:#A8E000;--ink:#0B0D10;--red:#FF5D5D;--amber:#FFB547;--blue:#73A9FF;--violet:#9B7BFF;
  --r:18px;--r2:12px;--shadow:0 10px 40px rgba(0,0,0,.35);
  --display:"Anton",Impact,"Arial Narrow",sans-serif;--body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,rgba(200,255,46,.07),transparent 60%),var(--bg)}
a{color:var(--lime)}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--lime);color:var(--ink)}
.hidden{display:none!important}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:10px clamp(14px,3vw,28px);background:rgba(11,13,16,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.04)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--text)}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px var(--lime)}
.nav{margin:0 auto;display:flex;gap:4px;background:#F2F3F5;border-radius:999px;padding:5px}
.nav a{display:flex;align-items:center;gap:7px;padding:7px 15px;border-radius:999px;color:#22262C;text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap;transition:.15s}
.nav a svg{width:17px;height:17px}
.nav a:hover{background:#E2E5E9}
.nav a.on{background:var(--lime);color:var(--ink)}
.topr{display:flex;align-items:center;gap:10px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.chip.off .dot{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);cursor:pointer;color:var(--text)}
.iconbtn:hover{border-color:var(--lime)}
.iconbtn svg{width:18px;height:18px}

main{max-width:1320px;margin:0 auto;padding:clamp(14px,2.2vw,24px) clamp(14px,3vw,28px) 110px}

/* ---------- tipografia ---------- */
.h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,48px);line-height:.92;letter-spacing:.01em;text-transform:uppercase;margin:0}
.h2{font-family:var(--display);font-weight:400;font-size:clamp(18px,1.7vw,22px);line-height:1;text-transform:uppercase;margin:0;letter-spacing:.02em}
.h3{font-size:16px;font-weight:700;margin:0}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.tag{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:4px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:6px 0 0;color:var(--muted);font-size:13px}

/* ---------- cartões ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.light{background:#F4F5F7;color:#14171C;border-color:#F4F5F7}
.card.light .label,.card.light .muted{color:#6B7380}
.card.lime{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.card.lime .label{color:rgba(11,13,16,.65)}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cardh p{font-size:12.5px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.kpi .num{font-family:var(--display);font-size:clamp(26px,2.6vw,34px);line-height:1;margin:6px 0 4px}
.kpi .var{font-size:12px;font-weight:700}
.up{color:var(--lime)}.down{color:var(--red)}
.card.light .up{color:#4C8A00}
.arrow{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;opacity:.6}
.rel{position:relative}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--muted)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.pri:hover{background:var(--lime2)}
.btn.white{background:#fff;color:var(--ink);border-color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(255,93,93,.4);background:transparent}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}

/* ---------- formulários ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:700;color:#C9CED6}
.field small{color:var(--muted);font-size:11.5px;line-height:1.4}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=url],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:none;transition:.15s;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(200,255,46,.12)}
textarea{min-height:72px;resize:vertical;line-height:1.5}
textarea.big{min-height:150px;font-family:var(--mono);font-size:12.5px}
input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:4px;cursor:pointer}
.fields{display:grid;gap:11px}
.secret{-webkit-text-security:disc;font-family:var(--mono)}
.f2{grid-template-columns:repeat(2,minmax(0,1fr))}
.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f4{grid-template-columns:repeat(4,minmax(0,1fr))}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);cursor:pointer}
.switch b{font-size:13px}.switch small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.switch input{appearance:none;width:40px;height:22px;border-radius:999px;background:var(--panel3);position:relative;cursor:pointer;flex:none;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--lime)}
.switch input:checked::after{left:21px;background:var(--ink)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--lime);color:var(--ink)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-weight:700}
.days button.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-size:13px;font-weight:700}
.pill:hover,.pill.on{border-color:var(--lime);color:var(--lime)}

/* ---------- biblioteca de perfis ---------- */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.cover{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;cursor:pointer;background:linear-gradient(150deg,#1d232c,#0f1216);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s;text-decoration:none;color:var(--text);display:block}
.cover:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--lime)}
.cover img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.88))}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:120px;color:rgba(255,255,255,.06)}
.cover .info{position:absolute;left:16px;right:16px;bottom:16px}
.cover .nm{font-family:var(--display);font-size:22px;line-height:1;text-transform:uppercase;margin:8px 0 4px;word-break:break-word}
.cover .sub{font-size:12.5px;color:#C9CED6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover .badges{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:6px}
.cover .lg{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--lime);background:#000}
.mini{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);font-size:11.5px;font-weight:700}
.mini.ok{color:var(--lime)}.mini.off{color:#aaa}
.cover .stats{display:flex;gap:14px;margin-top:10px;font-size:12.5px}
.cover .stats b{font-size:15px}
.cover .acts{position:absolute;top:64px;right:12px;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .15s}
.cover:hover .acts,.cover:focus-within .acts{opacity:1}
@media (hover:none){.cover .acts{opacity:1}}
.mini-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;cursor:pointer}
.mini-ic svg{width:14px;height:14px}
.mini-ic:hover{background:#fff;color:var(--ink)}
.mini-ic.del:hover{background:var(--red);color:#fff}
.icdel{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.icdel svg{width:15px;height:15px}
.icdel:hover{color:var(--red);border-color:rgba(255,93,93,.5)}
.new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:2px dashed var(--line);background:transparent}
.new:hover{border-color:var(--lime)}
.new .plus{width:48px;height:48px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:34px;font-weight:700}

/* ---------- página do perfil ---------- */
.hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:0;display:flex;align-items:center;padding:16px 18px;background:#151a21;border:1px solid var(--line)}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.55);transform:scale(1.04)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,16,.92),rgba(11,13,16,.35))}
.hero .in{position:relative;display:flex;gap:16px;align-items:center;width:100%;flex-wrap:wrap}
.hero .lg{width:64px;height:64px;border-radius:16px;object-fit:cover;border:3px solid var(--lime);background:#000;flex:none}
.hero .lgph{width:64px;height:64px;border-radius:16px;font-size:10px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;flex:none}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-weight:700;margin-bottom:14px}
.back:hover{color:var(--text)}
.pbody{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.tabs{position:sticky;top:64px;z-index:30;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;display:flex;gap:9px;align-items:center;text-align:left}
.tabs button:hover{color:var(--text);background:var(--panel2)}
.tabs button svg{width:16px;height:16px}
.tabs button.on{background:#F2F3F5;color:var(--ink);border-color:#F2F3F5}
.pane{display:none}.pane.on{display:block}
.drop{position:relative;border:2px dashed var(--line);border-radius:14px;background:var(--bg2);min-height:120px;max-height:200px;aspect-ratio:16/9;display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden;transition:.15s}
.drop:hover,.drop.over{border-color:var(--lime)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#07090b}
.drop .msg{position:relative;padding:18px;color:var(--muted);font-size:13px}
.drop .msg b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.drop .x{position:absolute;top:8px;right:8px;z-index:2}
.drop.has .msg{display:none}
.analysis{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:11.5px;color:#C9CED6;max-height:90px;overflow:auto}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;max-height:250px;overflow:auto;padding-right:4px}
.voice{position:relative;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:7px 10px;cursor:pointer;transition:.15s}
.voice:hover{border-color:var(--muted)}
.voice.on{border-color:var(--lime);background:rgba(200,255,46,.08)}
.voice b{display:block;font-size:13px}
.voice small{color:var(--muted);font-size:11px}
.voice .g{position:absolute;top:7px;right:8px;font-size:9px;font-family:var(--mono);color:var(--dim);text-transform:uppercase}
.savebar{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;visibility:hidden;pointer-events:none;z-index:60;display:flex;align-items:center;gap:16px;padding:10px 10px 10px 22px;border-radius:999px;background:#F2F3F5;color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.5);transition:transform .25s;font-weight:700;max-width:calc(100vw - 24px)}
.savebar.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
.savebar{transition:transform .25s,opacity .25s,visibility .25s}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.item .t small{color:var(--muted);font-size:12.5px}
.time{font-family:var(--display);font-size:18px;min-width:52px}
.st{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel3);color:#C9CED6;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.done{color:var(--lime);background:rgba(200,255,46,.1)}
.st.failed{color:var(--red);background:rgba(255,93,93,.1)}
.st.producing,.st.publishing{color:var(--blue);background:rgba(115,169,255,.1)}
.st.awaiting_approval,.st.atrasado{color:var(--amber);background:rgba(255,181,71,.1)}
.st.queued,.st.ready,.st.agendado{color:#C9CED6}
.thumb{width:54px;height:72px;border-radius:10px;background:#000;object-fit:cover;flex:none}
.job{border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:10px 12px}
.job .steps{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--muted);max-height:0;overflow:hidden;transition:max-height .3s}
.job.open .steps{max-height:400px;overflow:auto}
.job video,.job .imgs img{max-width:100%;border-radius:12px;margin-top:12px;background:#000}
.job .imgs{display:flex;gap:8px;overflow-x:auto}
.job .imgs img{height:220px}
.err{color:var(--red);font-size:13px;margin-top:6px;word-break:break-word}

/* ---------- conversa ---------- */
.chat{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:11px 15px;border-radius:18px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.nara{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.voce{background:var(--lime);color:var(--ink);border-bottom-right-radius:6px;align-self:flex-end;font-weight:600}
.msg small{display:block;font-size:11px;opacity:.6;margin-top:4px}
.composer{display:flex;gap:8px;margin-top:12px}
.composer input{border-radius:999px;padding:13px 18px}
.chatbig{height:min(56vh,520px)}
.suggest{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ---------- gráfico ---------- */
.spark{width:100%;height:90px;display:block}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars div{flex:1;background:var(--panel3);border-radius:6px 6px 2px 2px;min-height:4px;position:relative}
.bars div.hi{background:var(--lime)}

/* ---------- login / toast / modal ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:min(440px,100%)}
.login .h1{font-size:clamp(80px,18vw,130px)}
.toast{position:fixed;top:84px;right:20px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 40px))}
.toast div{background:#F2F3F5;color:var(--ink);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);animation:in .25s}
.toast div.bad{background:var(--red);color:#fff}
@keyframes in{from{transform:translateY(-8px);opacity:0}}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.modal .card{width:min(520px,100%);max-height:90vh;overflow:auto}
.steps-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:#C9CED6;font-size:14px}
.steps-list b{color:var(--text)}
code{font-family:var(--mono);background:var(--bg2);border:1px solid var(--line);padding:2px 7px;border-radius:7px;font-size:12.5px;word-break:break-all}
.logs{font-family:var(--mono);font-size:11px;background:#07090B;border:1px solid var(--line);border-radius:12px;padding:10px;height:220px;overflow:auto;white-space:pre-wrap;color:#AEB6C1}
.keyrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.keyrow .n{font-family:var(--display);font-size:22px;color:var(--dim);width:24px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:210px;overflow:auto;padding-right:4px}
.fontopt{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;color:var(--text)}
.fontopt:hover{border-color:var(--muted)}.fontopt.on{border-color:var(--lime);background:rgba(200,255,46,.08)}
.fontopt .aa{display:block;font-size:20px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontopt small{color:var(--muted);font-size:10.5px}
.fontlib{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto}
.fontlib span{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:12px}
.fontlib button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px}
.fontlib button:hover{color:var(--red)}
.refpath{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.refpath code{flex:1;min-width:0;font-size:11px}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-bottom:8px}
.refimg,.refadd{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.refimg img{width:100%;height:100%;object-fit:cover;display:block}
.refimg .ok{position:absolute;left:4px;bottom:4px;width:18px;height:18px;border-radius:50%;background:var(--lime);color:var(--ink);font-size:11px;font-style:normal;font-weight:700;display:grid;place-items:center}
.refimg .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;opacity:0;transition:.15s}
.refimg:hover .rm{opacity:1}
.refimg .rm:hover{background:var(--red)}
.refadd{display:grid;place-items:center;font-size:28px;color:var(--muted);cursor:pointer;border-style:dashed}
.refadd:hover{color:var(--lime);border-color:var(--lime)}
.refbox.over{outline:2px dashed var(--lime);outline-offset:4px;border-radius:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:22px 0}

/* ---------- responsivo ---------- */
@media (max-width:980px){.pbody{grid-template-columns:1fr}.tabs{flex-direction:row;overflow-x:auto;top:58px;padding:6px}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.f4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));margin:0;justify-content:space-between;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.55)}
  .nav a{flex-direction:column;gap:3px;padding:8px 6px;font-size:10.5px;flex:1}
  .nav a svg{width:20px;height:20px}
  .top .chip span{display:none}
  .g3,.g2,.f2,.f3{grid-template-columns:1fr}
  .savebar{bottom:96px}
  main{padding-bottom:150px}
  .hero{min-height:220px}
  .hero .lg,.hero .lgph{width:80px;height:80px;border-radius:20px}
}
@media (max-width:520px){.g4,.f4{grid-template-columns:1fr 1fr}.lib{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cover .nm{font-size:22px}.msg{max-width:92%}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login hidden">
  <div class="box">
    <div class="label">Assistente de conteúdo</div>
    <h1 class="h1">NARA<span style="color:var(--lime)">.</span></h1>
    <p class="muted" style="margin:6px 0 22px">Digite a senha da página para entrar.</p>
    <form id="loginForm" class="row" style="flex-wrap:nowrap">
      <input id="loginPass" type="password" placeholder="Senha" autocomplete="current-password" style="border-radius:999px;padding:14px 20px">
      <button class="btn pri" style="padding:14px 22px">Entrar</button>
    </form>
    <div id="loginErr" class="err"></div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <a class="logo" href="#/painel"><i></i>NARA</a>
    <nav class="nav" id="nav">
      <a href="#/painel" data-v="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Painel</a>
      <a href="#/perfis" data-v="perfis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/></svg>Perfis</a>
      <a href="#/agenda" data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
      <a href="#/nara" data-v="nara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Nara</a>
      <a href="#/ajustes" data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 1.2 14H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 7 2.6V2.5a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H23a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.5z"/></svg>Ajustes</a>
    </nav>
    <div class="topr">
      <span class="chip" id="statusChip"><i class="dot"></i><span id="statusTxt">Rodando</span></span>
      <button class="btn sm" id="runBtn" title="Parar ou iniciar a Nara">■ Parar</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div class="toast" id="toast"></div>
<div class="savebar" id="savebar"><span id="saveTxt">Alterações não salvas</span><button class="btn sm ghost" id="discardBtn" style="color:var(--ink);border-color:#cfd3d8">Desfazer</button><button class="btn pri" id="saveBtn">Salvar</button></div>

<script>
'use strict';
/* =================== utilidades =================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  del(k) { try { localStorage.removeItem(k); } catch (_) {} },
};
let TOKEN = store.get('naraToken');
let S = null;          // estado vindo do servidor
let VOICES = null;     // vozes
let DRAFT = null;      // rascunho do perfil aberto
let SDRAFT = {};       // alterações de ajustes
let dirty = false;
let saveFn = null;

function toast(msg, bad = false) {
  const d = document.createElement('div');
  d.textContent = msg;
  if (bad) d.className = 'bad';
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), bad ? 7000 : 3500);
}
async function api(path, opts = {}) {
  const o = { method: opts.method || (opts.body !== undefined ? 'POST' : 'GET'), headers: { 'x-nara-token': TOKEN } };
  if (opts.body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  const r = await fetch(path, o);
  if (r.status === 401 && !path.startsWith('/api/login')) { logout(); throw new Error('Senha necessária'); }
  if (opts.raw) { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Erro ' + r.status); return r; }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erro ' + r.status);
  return d;
}
async function busy(btn, fn) {
  const t = btn && btn.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span>Aguarde…</span>'; }
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) { btn.disabled = false; btn.innerHTML = t; } }
}
const fileUrl = (rel) => '/files/' + String(rel).split('\\').join('/').split('/').map(encodeURIComponent).join('/') + '?t=' + encodeURIComponent(TOKEN);
const refUrl = (name) => (name ? fileUrl('refs/' + name) : '');
const nf = (n) => (n == null || isNaN(n) ? '—' : Number(n).toLocaleString('pt-BR'));
const pct = (n) => (n == null || !isFinite(n) ? '—' : (n > 0 ? '+' : '') + n.toFixed(1).replace('.', ',') + '%');
const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function setPath(o, p, v) { const ks = p.split('.'); let x = o; ks.slice(0, -1).forEach((k) => (x = x[k] = x[k] || {})); x[ks[ks.length - 1]] = v; }
const ICON = {
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  yt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.8 15.1V8.9l5.7 3.1z"/></svg>',
  ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>',
  wave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 11v2"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-4 3 3 6-7"/></svg>',
};
const STATUS = { queued: 'Na fila', producing: 'Produzindo', ready: 'Pronto p/ postar', publishing: 'Postando', done: 'Publicado', failed: 'Falhou', awaiting_approval: 'Aguardando aprovação', agendado: 'Agendado', atrasado: 'Atrasado', perdido: 'Perdido' };
const TYPE = { video: 'Vídeo', carousel: 'Carrossel', image: 'Imagem' };

/* =================== login =================== */
function logout() { TOKEN = ''; store.del('naraToken'); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = $('#loginPass').value.trim();
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: t }) });
    if (!r.ok) throw new Error('Senha errada');
    TOKEN = t; store.set('naraToken', t); start();
  } catch (err) { $('#loginErr').textContent = err.message; }
});

/* =================== estado =================== */
async function refresh() {
  S = await api('/api/state');
  const paused = S.settings.paused;
  $('#statusChip').classList.toggle('off', paused);
  $('#statusTxt').textContent = paused ? 'Parada' : S.busy ? 'Produzindo…' : 'Rodando';
  const rb = $('#runBtn');
  rb.textContent = paused ? '▶ Iniciar' : '■ Parar';
  rb.classList.toggle('pri', paused);
  return S;
}
$('#runBtn').addEventListener('click', async () => {
  const stop = !S.settings.paused;
  const msg = stop
    ? 'Parar a Nara? Ela para a agenda, a produção e as tarefas automáticas. Se estiver produzindo algo, para na próxima etapa e volta para a fila. A página continua funcionando para você configurar.'
    : 'Iniciar a Nara? Ela volta a funcionar com tudo que está configurado (o que ficou na fila continua).';
  if (!(await ask(msg, stop ? 'Parar' : 'Iniciar', 'Cancelar', stop))) return;
  const rb = $('#runBtn');
  rb.disabled = true; rb.textContent = 'Aguarde…';
  try {
    await api('/api/settings', { body: { paused: stop } });
    toast(stop ? 'Nara parada' : 'Nara iniciada!');
  } catch (e) { toast(e.message, true); }
  rb.disabled = false;
  await refresh(); render();
});
const profById = (id) => S.profiles.find((p) => p.id === id);

/* crescimento a partir do histórico diário */
function series(pid, net) {
  const h = S.statsHistory || {};
  return Object.keys(h).sort().map((d) => ({ d, v: h[d][pid] && h[d][pid][net] ? h[d][pid][net].followers : null })).filter((x) => x.v != null);
}
function growth(pid, net, days) {
  const s = series(pid, net);
  if (s.length < 2) return null;
  const last = s[s.length - 1];
  const lim = new Date(last.d); lim.setDate(lim.getDate() - days);
  const base = [...s].reverse().find((x) => new Date(x.d) <= lim) || s[0];
  if (!base.v) return null;
  return ((last.v - base.v) / base.v) * 100;
}
function followers(pid) {
  const h = S.statsHistory || {}; const ds = Object.keys(h).sort().reverse();
  const out = { yt: null, ig: null };
  for (const d of ds) { const x = h[d][pid]; if (!x) continue; if (out.yt == null && x.youtube) out.yt = x.youtube.followers; if (out.ig == null && x.instagram) out.ig = x.instagram.followers; }
  return out;
}
function totalSeries() {
  const h = S.statsHistory || {};
  return Object.keys(h).sort().slice(-30).map((d) => {
    let t = 0;
    for (const v of Object.values(h[d])) t += (v.youtube ? v.youtube.followers : 0) + (v.instagram ? v.instagram.followers : 0);
    return { d, v: t };
  });
}
function spark(vals, w = 600, h = 120) {
  if (vals.length < 2) return `<div class="empty" style="padding:30px 0">O gráfico aparece depois de 2 dias de dados.</div>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * w, h - 10 - ((v - mn) / rg) * (h - 20)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8FF2E" stop-opacity=".35"/><stop offset="1" stop-color="#C8FF2E" stop-opacity="0"/></linearGradient></defs><path d="${line} L${w} ${h} L0 ${h}Z" fill="url(#gl)"/><path d="${line}" fill="none" stroke="#C8FF2E" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`;
}

/* =================== roteador =================== */
let pollTimer = null;
function current() { const h = location.hash.replace(/^#\/?/, '') || 'painel'; const [v, id] = h.split('/'); return { v, id }; }
let skipHash = false;
let lastHash = location.hash;
window.addEventListener('hashchange', async () => {
  if (skipHash) { skipHash = false; return; }
  if (dirty) {
    const target = location.hash;
    skipHash = true; location.hash = lastHash;
    if (!(await ask('Você tem alterações não salvas. Sair sem salvar?', 'Sair sem salvar', 'Continuar editando', true))) return;
    setDirty(false); location.hash = target; return;
  }
  lastHash = location.hash;
  render(); window.scrollTo(0, 0);
});
function render() {
  const { v, id } = current();
  $$('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.v === (v === 'perfil' ? 'perfis' : v)));
  const views = { painel: viewPainel, perfis: viewPerfis, perfil: () => viewPerfil(id), agenda: viewAgenda, nara: viewNara, ajustes: viewAjustes };
  (views[v] || viewPainel)();
}
function setDirty(on, fn) {
  dirty = on; if (fn) saveFn = fn;
  $('#savebar').classList.toggle('show', on);
}
$('#saveBtn').addEventListener('click', () => saveFn && busy($('#saveBtn'), saveFn));
$('#discardBtn').addEventListener('click', () => { setDirty(false); render(); });

/* =================== PAINEL =================== */
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
function viewPainel() {
  const today = S.today || [];
  const done = today.filter((s) => s.status === 'done').length;
  const queue = S.jobs.filter((j) => ['queued', 'producing', 'publishing', 'ready'].includes(j.status));
  const waiting = S.jobs.filter((j) => j.status === 'awaiting_approval');
  let tot = 0, var1 = 0, hasVar = false;
  for (const r of S.stats.perfis || []) {
    if (r.youtube) { tot += r.youtube.inscritos || 0; if (r.youtube.variacao != null) { var1 += r.youtube.variacao; hasVar = true; } }
    if (r.instagram) { tot += r.instagram.seguidores || 0; if (r.instagram.variacao != null) { var1 += r.instagram.variacao; hasVar = true; } }
  }
  const ts = totalSeries();
  const dt = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#view').innerHTML = `
  <div class="head">
    <div><div class="label">${esc(dt)}</div><h1 class="h1">${greeting()}.</h1><p>${S.settings.paused ? '<span class="tag" style="background:var(--amber)">Nara parada — clique em Iniciar lá em cima</span>' : `Hoje: <b>${done}</b> de <b>${today.length}</b> conteúdos publicados.`}</p></div>
    <div class="row"><button class="btn" id="bBrief">${ICON.mic} Briefing falado</button><a class="btn pri" href="#/perfis">${ICON.plus} Produzir conteúdo</a></div>
  </div>
  <div class="grid g4">
    <div class="card lime kpi rel"><div class="label">Seguidores (todos)</div><div class="num">${nf(tot)}</div><div class="var">${hasVar ? (var1 >= 0 ? '+' : '') + nf(var1) + ' desde ontem' : 'aguardando dados'}</div><span class="arrow">${ICON.arrow}</span></div>
    <div class="card kpi rel"><div class="label">Publicados hoje</div><div class="num">${done}<span class="dim" style="font-size:.5em">/${today.length}</span></div><div class="var muted">${today.filter((s) => s.status === 'agendado').length} ainda agendados</div></div>
    <div class="card kpi rel"><div class="label">Em produção</div><div class="num">${queue.length}</div><div class="var muted">${S.busy ? 'trabalhando agora' : 'fila livre'}</div></div>
    <div class="card light kpi rel"><div class="label">Aguardando você</div><div class="num">${waiting.length}</div><div class="var muted">${waiting.length ? 'aprove abaixo' : 'nada pendente'}</div></div>
  </div>
  <div class="split" style="margin-top:12px">
    <div class="card"><div class="cardh"><div><div class="label">Crescimento</div><h2 class="h2">Seguidores — 30 dias</h2></div><button class="btn sm" id="bStats">Atualizar números</button></div>${spark(ts.map((x) => x.v))}</div>
    <div class="card"><div class="cardh"><div><div class="label">Hoje</div><h2 class="h2">Agenda</h2></div><a class="btn sm ghost" href="#/agenda">Ver tudo</a></div>
      <div class="list">${today.slice(0, 6).map(slotRow).join('') || '<div class="empty">Nada agendado hoje. Crie um perfil e defina a frequência.</div>'}</div></div>
  </div>
  <div class="split" style="margin-top:12px">
    <div class="card"><div class="cardh"><div><div class="label">Produção</div><h2 class="h2">Últimos conteúdos</h2></div></div><div class="list" id="jobs">${S.jobs.slice(0, 8).map(jobCard).join('') || '<div class="empty">Ainda não há conteúdos. Abra um perfil e clique em “Produzir agora”.</div>'}</div></div>

function bindJobs(root = document) {
  $$('.job', root).forEach((el) => el.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = el.dataset.id; const j = S.jobs.find((x) => x.id === id) || {};
    const act = b.dataset.act;
    if (act === 'toggle') return el.classList.toggle('open');
    if (act === 'view') {
      const box = $('.media', el);
      if (box.innerHTML) { box.innerHTML = ''; return; }
      box.innerHTML = j.type === 'video' ? `<video controls autoplay playsinline src="${fileUrl(j.files[0])}" style="max-height:70vh"></video>` : `<div class="imgs">${j.files.map((f) => `<img src="${fileUrl(f)}" loading="lazy">`).join('')}</div>`;
      return;
    }
    if (act === 'del' && !(await ask('Apagar este conteúdo e os arquivos dele?', 'Apagar', 'Cancelar', true))) return;
    await busy(b, async () => {
      if (act === 'del') await api(`/api/jobs/${id}`, { method: 'DELETE' });
      else await api(`/api/jobs/${id}/${act}`, { body: {} });
      await refresh(); render(); toast(act === 'approve' ? 'Aprovado! Postando…' : act === 'retry' ? 'Tentando de novo…' : 'Apagado');
    });
  }));
}

function fld(label, f, type = 'text', extra = {}) {
  const v = getPath(DRAFT, f);
  const help = extra.help ? `<small>${extra.help}</small>` : '';
  if (type === 'textarea') return `<label class="field"><span>${label}</span><textarea data-f="${f}" class="${extra.big ? 'big' : ''}" placeholder="${esc(extra.ph || '')}">${esc(v)}</textarea>${help}</label>`;
  if (type === 'select') return `<label class="field"><span>${label}</span><select data-f="${f}">${extra.opts.map(([k, t]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>${help}</label>`;
  if (type === 'switch') return `<label class="switch"><span><b>${label}</b>${extra.help ? `<small>${extra.help}</small>` : ''}</span><input type="checkbox" data-f="${f}" ${v ? 'checked' : ''}></label>`;
  if (type === 'secret') return `<label class="field"><span>${label}</span><input type="text" class="secret" data-f="${f}" value="" placeholder="${esc(v || extra.ph || '')}" autocomplete="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')">${help}</label>`;
  if (type === 'list') return `<label class="field"><span>${label}</span><input type="text" data-f="${f}" value="${esc(v ?? '')}" list="${extra.list}" placeholder="${esc(extra.ph || '')}">${help}</label>`;
  if (type === 'color') return `<label class="field"><span>${label}</span><span class="row" style="flex-wrap:nowrap"><input type="color" data-f="${f}" value="${esc(v || '#ffffff')}"><input type="text" data-fc="${f}" value="${esc(v || '')}" style="font-family:var(--mono)"></span></label>`;
  return `<label class="field"><span>${label}</span><input type="${type}" data-f="${f}" value="${esc(v ?? '')}" placeholder="${esc(extra.ph || '')}" ${type === 'number' ? `min="${extra.min ?? 0}" max="${extra.max ?? 999}"` : ''}>${help}</label>`;
}
function dropzone(kind, file, title, hint, contain = true) {

function showTab(t) {

/* ---------- pasta de referências do perfil ---------- */
async function loadRefs(p) {
  let r;
  try { r = await api(`/api/profiles/${p.id}/refs`); } catch (e) { $$('.refbox').forEach((b) => (b.innerHTML = `<div class="err">${esc(e.message)}</div>`)); return; }
  $$('.refbox').forEach((box) => {
    const kind = box.dataset.refkind;
    const info = r[kind];
    const imgs = info.files.map((f) => `<div class="refimg" title="${esc(f.name)}${f.lastUsed ? ' — usada ' + new Date(f.lastUsed).toLocaleDateString('pt-BR') : ' — ainda não usada'}">
      <img loading="lazy" src="/api/profiles/${esc(p.id)}/refimg/${kind}/${encodeURIComponent(f.name)}?t=${encodeURIComponent(TOKEN)}">
      ${f.analysed ? '<i class="ok" title="Estilo já analisado (não gasta de novo)">✓</i>' : ''}
      <button type="button" class="rm" data-rmref="${esc(f.name)}" title="Remover">×</button></div>`).join('');
    box.innerHTML = `<div class="refpath"><code>${esc(info.dir)}</code><button type="button" class="btn sm" data-openref="${kind}">Abrir pasta</button></div>
      <div class="refgrid">${imgs}<label class="refadd" title="Adicionar imagens">+<input type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></label></div>
      <small class="muted">${info.files.length ? `${info.files.length} imagem(ns). Pode copiar direto para a pasta também.` : 'Vazia: coloque várias imagens de estilos diferentes (arraste para cá ou copie para a pasta).'}</small>`;
    $('[data-openref]', box).onclick = (e) => busy(e.currentTarget, () => api(`/api/profiles/${p.id}/refs/open`, { body: { kind } }));
    const inp = $('.refadd input', box);
    inp.onchange = () => uploadRefs(p, kind, [...inp.files]);
    box.ondragover = (e) => { e.preventDefault(); box.classList.add('over'); };
    box.ondragleave = () => box.classList.remove('over');
    box.ondrop = (e) => { e.preventDefault(); box.classList.remove('over'); uploadRefs(p, kind, [...e.dataTransfer.files].filter((f) => /^image\//.test(f.type))); };
    $$('[data-rmref]', box).forEach((b) => (b.onclick = async () => {
      if (!(await ask('Tirar esta imagem da pasta de referências?', 'Remover', 'Cancelar', true))) return;
      await api(`/api/profiles/${p.id}/refs/${kind}/${encodeURIComponent(b.dataset.rmref)}`, { method: 'DELETE' });
      loadRefs(p);
    }));
  });
}
async function uploadRefs(p, kind, files) {
  if (!files.length) return;
  toast(`Enviando ${files.length} imagem(ns)…`);
  try {
    const items = [];
    for (const f of files.slice(0, 30)) items.push({ name: f.name, dataUrl: await shrink(f, 'ref') });
    await api(`/api/profiles/${p.id}/refs`, { body: { kind, items } });
    toast('Referências adicionadas!');
  } catch (e) { toast(e.message, true); }
  loadRefs(p);
}

    <div><div class="label" style="margin-bottom:6px">Já usados (${t.total})</div><div class="list" style="max-height:260px;overflow:auto">${t.used.map((x) => row(x, true)).join('') || '<div class="empty">Nenhum ainda.</div>'}</div></div></div>`;

    if (!(await ask('Descartar os próximos temas? Na próxima produção a Claude pesquisa um lote novo (os já usados continuam bloqueados).', 'Trocar', 'Cancelar'))) return;

  };

/** Último registro de números de um perfil */
function latestStats(pid) {
  const h = S.statsHistory || {};
  for (const d of Object.keys(h).sort().reverse()) if (h[d][pid]) return h[d][pid];
  return {};
}
/** Busca os números do perfil na hora e redesenha o mini painel */
async function refreshProfileStats(p, quiet = true) {
  try {
    await api(`/api/profiles/${p.id}/stats`, { body: {} });
    await refresh();
    const { v, id } = current();
    if (v === 'perfil' && id === p.id && $('#pdash')) renderProfileDash(profById(p.id) || p);
    if (!quiet) toast('Números atualizados');
  } catch (e) { if (!quiet) toast(e.message, true); }
}
function renderProfileDash(p) {
  const f = followers(p.id);
  const g7 = growth(p.id, 'youtube', 7), g30 = growth(p.id, 'youtube', 30), i7 = growth(p.id, 'instagram', 7), i30 = growth(p.id, 'instagram', 30);
  const posts = S.jobs.filter((j) => j.profileId === p.id && j.status === 'done');
  const views = posts.map((j) => ((j.metrics && j.metrics.youtube && j.metrics.youtube.views) || 0) + ((j.metrics && j.metrics.instagram && j.metrics.instagram.views) || 0));
  // números mais recentes da conta (seguidores, posts, médias dos últimos posts)
  const L = latestStats(p.id);
  const ig = L.instagram || {}, yt = L.youtube || {};
  const avg = ig.avgViews != null ? ig.avgViews : views.length ? views.reduce((a, b) => a + b, 0) / views.length : null;
  const nPosts = (ig.posts || 0) + (yt.posts || 0);
  const hasYt = !!p.youtube.refreshToken;

  const top = posts.map((j, i) => ({ j, v: views[i] })).sort((a, b) => b.v - a.v).slice(0, 4);
  const mx = Math.max(1, ...top.map((x) => x.v));

  $('#pdash').innerHTML = `<div class="grid g4">
    <div class="card kpi"><div class="label">Seguidores Instagram</div><div class="num">${nf(ig.followers ?? f.ig)}</div><div class="var ${i7 == null ? 'muted' : i7 >= 0 ? 'up' : 'down'}">${pct(i7)} em 7 dias · ${pct(i30)} em 30</div></div>
    <div class="card kpi"><div class="label">${hasYt ? 'Inscritos YouTube' : 'Posts na conta'}</div><div class="num">${hasYt ? nf(yt.followers ?? f.yt) : nf(nPosts || null)}</div><div class="var ${hasYt ? (g7 == null ? 'muted' : g7 >= 0 ? 'up' : 'down') : 'muted'}">${hasYt ? `${pct(g7)} em 7 dias · ${nf(yt.posts)} vídeos` : 'Instagram'}</div></div>
    <div class="card kpi lime"><div class="label">Média de views por post</div><div class="num">${avg == null ? '—' : nf(Math.round(avg))}</div><div class="var">${ig.avgLikes != null ? `${nf(ig.avgLikes)} curtidas · ${nf(ig.avgComments)} coment. (últimos ${ig.sample})` : `${posts.length} posts da Nara`}</div></div>
    <div class="card kpi"><div class="label">Crescimento ${hasYt ? '' : `· ${nf(nPosts)} posts`}</div>${spark(ser.map((x) => x.v), 300, 60)}<div class="var muted" style="margin-top:4px">${L.at ? 'atualizado ' + new Date(L.at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : ''} <a href="#" id="bRefStats" style="margin-left:6px">atualizar</a></div></div>
  </div>${err}
  ${top.length ? `<div class="card" style="margin-top:12px"><div class="cardh"><h3 class="h3">Melhores assuntos (a Nara segue estes)</h3><span class="label">views</span></div><div class="list">${top.map((x) => `<div class="item"><div class="t"><b>${esc(x.j.title)}</b><div style="height:6px;border-radius:6px;background:var(--panel3);margin-top:8px"><div style="height:6px;border-radius:6px;background:var(--lime);width:${Math.max(3, (x.v / mx) * 100)}%"></div></div></div><b>${nf(x.v)}</b></div>`).join('')}</div></div>` : ''}`;
  const rb = $('#bRefStats');
  if (rb) rb.onclick = (e) => { e.preventDefault(); rb.textContent = 'atualizando…'; refreshProfileStats(p, false); };
}

    inp.addEventListener('change', () => inp.files[0] && upload(p, d.dataset.kind, inp.files[0]));

  });

function keepDraft(fn) { const d = DRAFT, wasDirty = dirty; fn(); }
async function shrink(file, kind) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = kind === 'logo' ? 800 : kind === 'ref' ? 1200 : 1600; // referências menores = análise mais barata
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return kind === 'logo' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.9);
}
async function upload(p, kind, file) {
  const d = $(`.drop[data-kind="${kind}"]`);
  d.innerHTML = '<div class="msg"><b>Enviando…</b>' + (kind === 'reference' || kind === 'carousel' ? 'A Claude está analisando o estilo (uns 10 s).' : '') + '</div>';
  try {
    if (dirty) await saveProfile();
    const r = await api(`/api/profiles/${p.id}/image`, { body: { kind, dataUrl: await shrink(file, kind) } });
    if (r.warning) toast(r.warning, true); else toast(kind === 'reference' || kind === 'carousel' ? 'Referência analisada!' : 'Imagem salva!');
  } catch (e) { toast(e.message, true); }
  await refresh(); viewPerfil(p.id);
}
async function saveProfile() {
  const body = structuredClone(DRAFT);
  if (body.instagram && (!body.instagram.accessToken || body.instagram.accessToken.includes('••'))) delete body.instagram.accessToken;
  else if (body.instagram) {
    // token novo: se o ID não foi mexido, a Nara descobre a conta de novo
    const orig = profById(body.id);
    if (orig && String(orig.instagram.userId || '') === String(body.instagram.userId || '')) body.instagram.userId = '';
  }
  if (body.youtube) delete body.youtube.refreshToken;
  await api('/api/profiles', { body });
  setDirty(false); await refresh();
  toast('Perfil salvo!');
  const { v, id } = current();
  if (v === 'perfil' && id === body.id) { const t = sessionStorage.getItem('ptab'); viewPerfil(id).then(() => t && showTab(t)); }
}

function bindSettingsInputs() {

      setPath(SDRAFT, el.dataset.s, v);

    });
  });

async function saveSettings() {
  await api('/api/settings', { body: SDRAFT });
  if (SDRAFT.newAdminToken) { TOKEN = SDRAFT.newAdminToken; store.set('naraToken', TOKEN); }
  SDRAFT = {}; setDirty(false); await refresh(); toast('Ajustes salvos!'); render();
}

/* =================== início =================== */
async function start() {
  try { await refresh(); } catch (e) { if (!TOKEN) return; $('#loginErr').textContent = e.message; return; }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  render();
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (document.hidden) return;
    const { v } = current();
    try {
      await refresh();
      if ((v === 'painel' || v === 'agenda') && !document.querySelector('.job.open, .job video, #chatIn:focus') && !dirty) render();
      else if (v === 'nara') renderChat();
    } catch (_) {}
  }, 15000);
}
if (TOKEN) start(); else logout();
</script>
